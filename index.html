<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ia r</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://puter.com"></script>



</head>
<body>
    <div class="painel">
        <h1>bem vindo a ia r</h1>
        <p id="textoResposta"></p>
        <input type="text" id="campoPergunta" placeholder="pergunte qualquer coisa">
        <button id="btnEnviar">Enviar</button>

    <div>

         
    <script>
     const input = document.getElementById('campoPergunta');
    const botao = document.getElementById('btnEnviar');
    const respostaEl = document.getElementById('textoResposta');

    // Lista que guarda a memória da conversa atual
    let historicoConversa = [];

    async function enviarPergunta() {
        const pergunta = input.value.trim();
        if (!pergunta) return;

        respostaEl.innerText = "Pensando...";
        input.value = "";

        // Salva a sua pergunta na memória
        historicoConversa.push({ role: 'user', content: pergunta });

        // Mantém as últimas 20 mensagens para não estourar o limite da API
        if (historicoConversa.length > 20) {
            historicoConversa = historicoConversa.slice(-20);
        }

        try {
            const res = await fetch('https://onrender.com', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ historico: historicoConversa })
            });

            const dados = await res.json();
            if (dados.erro) throw new Error(dados.erro);

            // Salva a resposta da IA na memória também
            historicoConversa.push({ role: 'assistant', content: dados.resposta });

            respostaEl.innerText = dados.resposta;
        } catch (error) {
            respostaEl.innerText = "Erro: " + error.message;
        }
    }
</script>

    

    

    
</body>
</html>
